# SKF Gateway SSH policy
 
# Direct/network password SSH is disabled by default.
PasswordAuthentication no
 
# Root is not allowed through ordinary network-facing SSH.
PermitRootLogin no
 
# Only root is ever accepted by sshd.
# skfgw remains an application/local account.
AllowUsers root
 
 
# Reverse SSH connects back into the Gateway's sshd
# through localhost:22.
#
# Allow root password login only for loopback-originated SSH.
Match Address 127.0.0.1,::1
    PasswordAuthentication yes
    PermitRootLogin yes
 
Match all