#!/usr/bin/env bash


# ============================================================
# IndustrialGW / GW Release Configuration
# ============================================================


# ------------------------------------------------------------
# Git
# ------------------------------------------------------------

GIT_REMOTE="origin"


# ------------------------------------------------------------
# IMPORTANT:
#
# 当前 YAML 的 GW_0oml source 固定为 gw_new_for_merge。
#
# 因为当前多 source 使用同一个 repository URL，
# 本版 release.sh 故意不使用 runningBranchs。
#
# 因此为了避免：
#
#   本地 push feature/A
#   Flow 却构建 gw_new_for_merge
#
# 当前自动 Release 强制要求本地处于该分支。
# ------------------------------------------------------------

RELEASE_BRANCH="gw_new_for_merge"


# ------------------------------------------------------------
# Version,origin from skf_gw_mqtt/middleware/common/global.h, remember to update it when you change the version in global.h
# ------------------------------------------------------------

GLOBAL_H="skf_gw_mqtt/middleware/common/global.h"

VERSION_DEFINE="CONFIG_APPLICATION_VERSION"

# Set this to the application version you want to release (x.y.z).
# If empty, no automatic write will be performed to source files.
RELEASE_VERSION = "" # e.g. "2.0.1"


# ------------------------------------------------------------
# Local validation / build
# ------------------------------------------------------------

LOCAL_BUILD_ENABLED="1" # 1: enable local build, 0: disable local build

LOCAL_BUILD_COMMAND="cd skf_gw && ./build.sh newutest UNITTEST_UNIVERSE 0 0"


# ------------------------------------------------------------
# Alibaba Yunxiao Flow
# ------------------------------------------------------------

FLOW_API_BASE="https://openapi-rdc.aliyuncs.com"


# 当前组织 ID

FLOW_ORGANIZATION_ID="6347c4cf0e55ca746598185e"


# YAML Flow Pipeline ID

FLOW_PIPELINE_ID="5199494"


# 每多少秒查询一次 Flow 状态

FLOW_POLL_INTERVAL="10"


# 最长等待 5 小时

FLOW_TIMEOUT_SECONDS="18000"


# ------------------------------------------------------------
# Allowed Build IDs
#
# 这里只放已经真正迁入 YAML 的 Build。
# ------------------------------------------------------------

FLOW_BUILD_IDS=(

    "GW_ALL_NEW_24_PRODUCTS"
    "GW_ALLPRO_NEW_24_PRODUCTS"
    "GW_ALLACC_NEW_24_PRODUCTS"
    "GW_ALLACCPRO_NEW_24_PRODUCTS"

)

# ------------------------------------------------------------
# Build ID -> YAML Job display name
#
# IMPORTANT:
#
# 右边必须与 YAML：
#
# jobs:
#   xxx:
#     name: ...
#
# 的 name 完全一致。
#
# release.sh 用这个映射找到“本次Build自己的Artifact”，
# 防止多个Build同时运行时拿错包。
# ------------------------------------------------------------

declare -A FLOW_JOB_NAME_BY_BUILD=(

    ["GW_ALL_NEW_24_PRODUCTS"]="Build all_gw_new_24 products"
    ["GW_ALLPRO_NEW_24_PRODUCTS"]="Build allpro_gw_new_24 products"
    ["GW_ALLACC_NEW_24_PRODUCTS"]="Build allacc_gw_new_24 products"
    ["GW_ALLACCPRO_NEW_24_PRODUCTS"]="Build allaccpro_gw_new_24 products"

)


# ------------------------------------------------------------
# Local artifact destination
# ------------------------------------------------------------

DOWNLOAD_ROOT="${HOME}/Flow_Downloads"

GATEWAY_OUTPUT_TEMPLATE_BASE="gatewayApp_{VERSION}_{DATETIME}_{SHORT_COMMIT}.tar.gz"

PACKAGE_OUTPUT_TEMPLATE_BASE="skf_package_{VERSION}_{DATETIME}_{SHORT_COMMIT}.tar.gz"

DUMMY_OUTPUT_TEMPLATE_BASE="gatewayAppDummy_{VERSION}_{DATETIME}_{SHORT_COMMIT}.tar.gz"

# Compute per-build templates: if a build id contains "PRO" then insert
# "_PRO" after the first field of the filename (e.g. gatewayApp -> gatewayApp_PRO)
declare -A FLOW_OUTPUT_TEMPLATE_BY_BUILD
for build in "${!FLOW_JOB_NAME_BY_BUILD[@]}"; do
    # Gateway template
    first="${GATEWAY_OUTPUT_TEMPLATE_BASE%%_*}"
    rest="${GATEWAY_OUTPUT_TEMPLATE_BASE#${first}}"
    if [[ "$build" == *PRO* ]]; then
        FLOW_OUTPUT_TEMPLATE_BY_BUILD["$build,gateway"]="${first}_PRO${rest}"
    else
        FLOW_OUTPUT_TEMPLATE_BY_BUILD["$build,gateway"]="$GATEWAY_OUTPUT_TEMPLATE_BASE"
    fi

    # Package template
    firstp="${PACKAGE_OUTPUT_TEMPLATE_BASE%%_*}"
    restp="${PACKAGE_OUTPUT_TEMPLATE_BASE#${firstp}}"
    if [[ "$build" == *PRO* ]]; then
        FLOW_OUTPUT_TEMPLATE_BY_BUILD["$build,package"]="${firstp}_PRO${restp}"
    else
        FLOW_OUTPUT_TEMPLATE_BY_BUILD["$build,package"]="$PACKAGE_OUTPUT_TEMPLATE_BASE"
    fi

    # Dummy template
    firstd="${DUMMY_OUTPUT_TEMPLATE_BASE%%_*}"
    restd="${DUMMY_OUTPUT_TEMPLATE_BASE#${firstd}}"
    if [[ "$build" == *PRO* ]]; then
        FLOW_OUTPUT_TEMPLATE_BY_BUILD["$build,dummy"]="${firstd}_PRO${restd}"
    else
        FLOW_OUTPUT_TEMPLATE_BY_BUILD["$build,dummy"]="$DUMMY_OUTPUT_TEMPLATE_BASE"
    fi
done

# Helper to get a template for a build and type (gateway|package|dummy)
get_output_template_for_build() {
    local build="$1"
    local typ="$2"
    echo "${FLOW_OUTPUT_TEMPLATE_BY_BUILD["$build,$typ"]}" || echo ""
}

# Sync version numbers into source files when RELEASE_VERSION is non-empty.
_sync_versions() {
    if [[ -z "${RELEASE_VERSION}" ]]; then
        return 0
    fi

    # Absolute path of GLOBAL_H
    GH="${PWD}/${GLOBAL_H}"
    if [[ ! -f "${GH}" ]]; then
        echo "Warning: GLOBAL_H file not found: ${GH}" >&2
    else
        # extract current version from GLOBAL_H (if any)
        prev=$(grep -E "#define[[:space:]]+${VERSION_DEFINE}" "${GH}" | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/' || true)
        # Update the define (preserve surrounding comment if any)
        if grep -qE "#define[[:space:]]+${VERSION_DEFINE}" "${GH}"; then
            sed -i -E "s/(#define[[:space:]]+${VERSION_DEFINE}[[:space:]]+)\".*\"/\1\"${RELEASE_VERSION}\"/" "${GH}"
        else
            echo "#define ${VERSION_DEFINE} \"${RELEASE_VERSION}\"" >> "${GH}"
        fi
        echo "Updated ${GH}: ${prev} -> ${RELEASE_VERSION}"
    fi

    # Update generateADummyVersionForFUOTA.sh
    GEN_SCRIPT="${PWD}/generateADummyVersionForFUOTA.sh"
    if [[ ! -f "${GEN_SCRIPT}" ]]; then
        echo "Warning: generate script not found: ${GEN_SCRIPT}" >&2
    else
        # If prev not set, try to read from generate script currentVer
        if [[ -z "${prev}" ]]; then
            prev=$(grep -E "^currentVer=" "${GEN_SCRIPT}" | head -n1 | sed -E 's/currentVer=(.*)/\1/' || true)
        fi
        sed -i -E "s/^currentVer=.*/currentVer=${prev}/" "${GEN_SCRIPT}"
        sed -i -E "s/^dummyVer=.*/dummyVer=${RELEASE_VERSION}/" "${GEN_SCRIPT}"
        echo "Updated ${GEN_SCRIPT}: currentVer=${prev}, dummyVer=${RELEASE_VERSION}"
    fi
}

# Run sync on load so editing this file updates the targets immediately.
_sync_versions
