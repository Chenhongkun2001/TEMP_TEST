# Example of sample specific Kconfig changes when building sample with MCUboot
# when using sysbuild.
# CONFIG_MCUBOOT_LOG_LEVEL_WRN=y
CONFIG_MCUBOOT_LOG_LEVEL_DBG=y
CONFIG_BOOT_UPGRADE_ONLY=y
CONFIG_MCUBOOT_SERIAL=y
CONFIG_UART_CONSOLE=n
# BOOT_SERIAL_DEVICE=CONFIG_BOOT_SERIAL_UART
CONFIG_BOOT_SERIAL_UART=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=10000
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=n

CONFIG_BOOT_SERIAL_IMG_GRP_HASH=y
#CONFIG_BOOT_SERIAL_IMG_GRP_IMAGE_STATE=y
CONFIG_SINGLE_APPLICATION_SLOT=y
